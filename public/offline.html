<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1f9">
  <title>ยังเชื่อมต่อไม่ได้ · Soundboard</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f1f9; --card:#fff; --ink:#201c30; --muted:#706783; --accent:#7c56b5; --line:#ded7ec; }
    @media(prefers-color-scheme:dark) { :root { --bg:#171520; --card:#252130; --ink:#f5f1fc; --muted:#bfb3d4; --accent:#bda1ea; --line:#51465f; } }
    * { box-sizing:border-box; } body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--ink); font:16px/1.8 Tahoma,sans-serif; }
    main { max-width:400px; padding:28px; border:1px solid var(--line); background:var(--card); border-radius:22px; }
    h1 { font-size:23px; line-height:1.5; margin:0 0 12px; } p { color:var(--muted); margin:0 0 24px; }
    a { display:block; min-height:48px; padding:10px 20px; border:1px solid var(--accent); border-radius:14px; color:var(--accent); text-align:center; text-decoration:none; font-weight:600; }
    a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  </style>
</head>
<body><main><h1>ยังเชื่อมต่อไม่ได้</h1><p>ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง การควบคุมเสียงไลฟ์ต้องเชื่อมต่อกับเซิร์ฟเวอร์</p><a href="/controller">ลองเชื่อมต่อใหม่</a></main></body>
</html>
